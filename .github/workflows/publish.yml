name: Publish

on:
  workflow_dispatch:

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cargo build (verify)
        run: cargo build --locked --verbose

      - name: Dispatch Linux build workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build/linux.yml
          ref: ${{ github.ref_name }}

      - name: Dispatch macOS build workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build/mac.yml
          ref: ${{ github.ref_name }}

      - name: Dispatch Windows build workflow
        uses: peter-evans/workflow-dispatch@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          workflow: build/windows.yml
          ref: ${{ github.ref_name }}
